<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
  <title id="t">Chorus: identity belongs to the conversation</title>
  <desc id="d">Chorus organization banner with the speech-bubble C monogram, the tagline, and an illustrative conversation in which participants named Ash, River and Echo exchange three short messages.</desc>
  <style>
    :root { --bg:#ffffff; --sub:#f9fafb; --tx:#111827; --tx2:#4b5563; --bd:#eaecf0; --ac:#0969da; --bub:#f3f4f6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121417; --sub:#1a1d21; --tx:#e6edf3; --tx2:#9198a1; --bd:#30363d; --ac:#58a6ff; --bub:#22262c; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; fill:var(--tx); }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .s { fill:var(--tx2); }
    .a { fill:var(--ac); }
    .panel { fill:var(--sub); stroke:var(--bd); stroke-width:2; }
    .bub { fill:var(--bub); stroke:var(--bd); stroke-width:2; }
  </style>
  <rect x="1" y="1" width="1198" height="438" rx="24" fill="var(--bg)" stroke="var(--bd)" stroke-width="2"/>
  <g transform="translate(112 112) scale(0.22)">
    <path d="M 90 -165 A 185 185 0 1 0 -150 75 L -205 160 L -115 145 A 185 185 0 0 0 90 165" fill="none" stroke="var(--ac)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 60 -105 A 120 120 0 1 0 60 105" fill="none" stroke="var(--tx)" stroke-width="28" stroke-linecap="round"/>
  </g>
  <text x="190" y="110" font-size="68" font-weight="800" letter-spacing="-2">Chorus</text>
  <text class="m s" x="190" y="146" font-size="20">github.com/joinchorus</text>
  <g font-size="52" font-weight="800" letter-spacing="-1.5">
    <text x="64" y="244">Identity belongs to</text>
    <text x="64" y="304">the conversation.</text>
    <text class="s" x="64" y="364">Not the person.</text>
  </g>
  <text class="s" x="64" y="410" font-size="22">Open-source anonymous discussion · early development · MIT</text>

  <g id="thread">
    <rect class="panel" x="660" y="48" width="476" height="344" rx="20"/>
    <text class="m s" x="688" y="88" font-size="20">thread, illustrative</text>
    <rect class="bub" x="688" y="112" width="330" height="76" rx="38"/>
    <text class="a" x="718" y="142" font-size="20" font-weight="700">Ash</text>
    <text x="718" y="172" font-size="22">Who am I talking to?</text>
    <rect fill="var(--tx)" x="778" y="208" width="330" height="76" rx="38"/>
    <text x="808" y="238" font-size="20" font-weight="700" style="fill:var(--ac)">River</text>
    <text x="808" y="268" font-size="22" style="fill:var(--bg)">Nobody in particular.</text>
    <rect class="bub" x="688" y="304" width="330" height="76" rx="38"/>
    <text class="a" x="718" y="334" font-size="20" font-weight="700">Echo</text>
    <text x="718" y="364" font-size="22">Only what is said.</text>
  </g>
</svg>
