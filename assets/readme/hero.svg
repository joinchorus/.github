<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { fill: none; stroke: #21262d; stroke-width: 2; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 52px; fill: #f0f6fc; letter-spacing: -0.05em; }
      .text-tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 22px; fill: #8b949e; }
      .badge-bg { fill: #238636; fill-opacity: 0.15; stroke: #3fb950; stroke-width: 1.5; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 13px; font-weight: 700; fill: #3fb950; letter-spacing: 0.05em; }
      .repo-name { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 15px; font-weight: 700; fill: #58a6ff; }
      .repo-desc { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Outer Background -->
  <rect class="bg" width="1200" height="420" rx="16" />
  <rect class="border" x="1" y="1" width="1198" height="418" rx="15" />

  <!-- Content Container -->
  <g transform="translate(60, 60)">
    <!-- Top Badge -->
    <rect class="badge-bg" x="0" y="0" width="220" height="32" rx="16" />
    <text class="badge-text" x="110" y="21" text-anchor="middle">OPEN SOURCE ECOSYSTEM</text>

    <!-- Main Title -->
    <text class="text-title" x="0" y="100">Chorus Project</text>

    <!-- Subtitle -->
    <text class="text-tagline" x="0" y="142">Identity belongs to the conversation.</text>

    <!-- Right-Side Visual Card: Ecosystem Topology -->
    <g transform="translate(580, -10)">
      <rect class="card-bg" x="0" y="0" width="500" height="290" rx="12" />
      
      <!-- Card Header -->
      <path d="M0 12C0 5.37 5.37 0 12 0H488C494.63 0 500 5.37 500 12V40H0V12Z" fill="#21262d" />
      <circle cx="20" cy="20" r="6" fill="#ff5f56" />
      <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
      <circle cx="60" cy="20" r="6" fill="#27c93f" />
      <text font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" fill="#8b949e" x="80" y="24">github.com/joinchorus</text>

      <!-- Repo Cards Grid -->
      <g transform="translate(24, 60)">
        <!-- Repo 1: chorus -->
        <rect fill="#0d1117" stroke="#30363d" stroke-width="1" x="0" y="0" width="452" height="60" rx="8" />
        <text class="repo-name" x="20" y="26">joinchorus/chorus</text>
        <text class="repo-desc" x="20" y="46">Go Backend, React SPA, REST API &amp; Native Git Engine &bull; chat.joinchorus.app</text>

        <!-- Repo 2: website -->
        <g transform="translate(0, 72)">
          <rect fill="#0d1117" stroke="#30363d" stroke-width="1" x="0" y="0" width="452" height="60" rx="8" />
          <text class="repo-name" x="20" y="26">joinchorus/website</text>
          <text class="repo-desc" x="20" y="46">Marketing Website &amp; Product Manifesto &bull; joinchorus.app</text>
        </g>

        <!-- Repo 3: docs -->
        <g transform="translate(0, 144)">
          <rect fill="#0d1117" stroke="#30363d" stroke-width="1" x="0" y="0" width="452" height="60" rx="8" />
          <text class="repo-name" x="20" y="26">joinchorus/docs</text>
          <text class="repo-desc" x="20" y="46">13 REST API Specs, Architecture &amp; RFCs &bull; docs.joinchorus.app</text>
        </g>
      </g>
    </g>
  </g>
</svg>
